[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distill-mcp"
version = "0.1.0"
description = "Privacy-first team memory MCP server — local LLM distillation before team sync"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "lancedb>=0.18",
    "httpx>=0.27",
    "structlog>=25.5.0",
]

[project.scripts]
distill = "distill_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/distill_mcp"]

# --- Ruff ---
[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
fixable = ["ALL"]
extend-select = ["B", "C4", "I", "PIE", "RUF", "SIM", "UP"]
ignore = [
    "COM812",   # trailing comma — conflicts with ruff format
    "PLR0913",  # too-many-arguments — MCP tools have wide signatures
    "SIM102",   # collapsible-if — sometimes clearer expanded
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["distill_mcp"]

# --- ty (Astral) ---
[tool.ty.environment]
python-version = "3.11"

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/distill_mcp --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src/distill_mcp"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
]
