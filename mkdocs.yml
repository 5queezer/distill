site_name: 🧪 Distill
site_description: Privacy-first Team Memory MCP Server
site_url: https://5queezer.github.io/distill
repo_url: https://github.com/5queezer/distill
repo_name: 5queezer/distill

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mermaid2

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorials:
    - Getting Started: tutorials/getting-started.md
  - How-To Guides:
    - Installation: how-to/installation.md
    - GPU Setup: how-to/gpu-setup.md
    - Seed from Git: how-to/seed-from-git.md
    - GCP Backend: how-to/gcp-backend.md
    - Neon Backend: how-to/neon-backend.md
    - AWS Backend: how-to/aws-backend.md
    - Azure Backend: how-to/azure-backend.md
  - Reference:
    - MCP Tools: reference/tools.md
    - Configuration: reference/configuration.md
  - Explanation:
    - How Memory Works: explanation/how-memory-works.md
    - Architecture: explanation/architecture.md
    - Privacy Model: explanation/privacy-model.md
